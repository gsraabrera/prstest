name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Hahanap ng credentials/passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep (LASER FOCUS sa SQL Injection Lang gamit ang Generic Rules Filter)
    # Patatakbuhin natin ang buong p/php ruleset pero gagamit tayo ng 'grep' para saluhin lang
    # ang mga errors na may kinalaman sa SQL injection.
    - name: Run Semgrep (SQLi Only)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --text \
          > semgrep_results.txt || true
        
        # Dito natin sasalain: I-print lang ang mga linya kung nasaan ang SQL Injection
        echo "=== SQL INJECTION SCAN RESULTS ==="
        if grep -A 5 -B 2 "tainted-sql-string" semgrep_results.txt; then
          echo "❌ ERROR: May nakitang SQL Injection sa code mo! Pakiaayos bago mag-deploy."
          exit 1
        else
          echo "✅ SQL Injection Scan Passed! Ligtas ang custom code mo."
          exit 0
        fi