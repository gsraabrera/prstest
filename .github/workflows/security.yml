name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Hahanap ng credentials/passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep (LASER FOCUS sa SQL Injection Lang na may Kumpletong Detalye)
    - name: Run Semgrep (SQLi Only)
      run: |
        # Patakbuhin si Semgrep at i-save ang buong text report
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --text \
          > semgrep_results.txt || true
        
        echo "=== SQL INJECTION SCAN RESULTS ==="
        
        # Titingnan kung may 'tainted-sql-string' sa resulta
        if grep -q "tainted-sql-string" semgrep_results.txt; then
          echo "❌ ERROR: May nakitang SQL Injection sa code mo!"
          echo "--------------------------------------------------------"
          
          # Hahanapin ang bawat block ng SQL Injection at ipapakita ang detalye (30 lines after ng filename)
          grep -B 1 -A 25 "tainted-sql-string" semgrep_results.txt
          
          echo "--------------------------------------------------------"
          echo "Aksyon: Pakiaayos ang query sa itaas bago mag-deploy."
          exit 1
        else
          echo "✅ SQL Injection Scan Passed! Ligtas ang custom code mo."
          exit 0
        fi