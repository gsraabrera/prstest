name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # SEMGREP WORKFLOW WITH FIXED PHPRUNNER SYNTAX DETECTORS
    - name: Run Semgrep (With PHPRunner Custom Rules)
      run: |
        # Re-writing the custom rule file using correct metavariable syntax
        cat << 'EOF' > phprunner_rules.yaml
        rules:
          - id: phprunner-sqli
            languages: [php]
            message: "⚠️ WARNING: Detected string concatenation inside a PHPRunner Database command. This is highly vulnerable to SQL Injection. Use parameterized bindings (e.g., :1, :2) instead."
            severity: WARNING
            pattern-either:
              - pattern: DB::Query($QUERY . $VAR, ...)
              - pattern: DB::Exec($QUERY . $VAR, ...)
              - pattern: CustomQuery($QUERY . $VAR, ...)
              - pattern: db_query($QUERY . $VAR, ...)
          - id: phprunner-xss
            languages: [php]
            message: "⚠️ WARNING: Direct echoing of raw HTTP request data detected. Use htmlspecialchars() or htmlentities() to prevent Cross-Site Scripting (XSS)."
            severity: WARNING
            pattern: echo $TEXT . $VAR;
        EOF

        # Patatatakbuhin si Semgrep gamit ang official rules AT ang bagong phprunner_rules.yaml
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --config="/src/phprunner_rules.yaml" \
          --text \
          > semgrep_results.txt || true
        
        echo "=== ADVANCED SECURITY SCAN RESULTS ==="
        
        # Pagsasama-samahin ang pagsala kasama ang bago nating nadiskubreng rules
        if egrep -q "tainted-sql-string|command-injection|cross-site-scripting|phprunner-sqli|phprunner-xss" semgrep_results.txt; then
          echo "⚠️ WARNING: Critical Security Vulnerability Found in Code!"
          echo "--------------------------------------------------------"
          
          egrep -B 1 -A 25 "tainted-sql-string|command-injection|cross-site-scripting|phprunner-sqli|phprunner-xss" semgrep_results.txt
          
          echo "--------------------------------------------------------"
          echo "Notice: Please remediate the code flaws above. Deployment is proceeding."
          exit 0
        else
          echo "✅ Security Scan Passed! Custom code is resilient against SQLi, XSS, and Command Injection."
          exit 0
        fi