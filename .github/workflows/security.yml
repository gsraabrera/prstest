name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Hahanap ng credentials/passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep (LASER FOCUS sa SQL Injection Lang)
    # Gagamit tayo ng '--only-rule' flag para patayin ang lahat ng ibang ingay.
    - name: Run Semgrep (SQLi Only)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --only-rule="php.lang.security.injection.tainted-sql-string.tainted-sql-string" \
          --error