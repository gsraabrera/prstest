name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Hahanap ng credentials/passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep (LASER FOCUS sa SQL Injection Lang gamit ang Inline Pattern)
    # Gagamit tayo ng pattern filter para dedmahin ang lahat ng ibang rules sa buong mundo.
    - name: Run Semgrep (SQLi Only)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --lang=php \
          --pattern='$SQL = "... " . $INPUT;' \
          --error