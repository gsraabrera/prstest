name: PHPRunner Security Scan

on:
  push:
    branches: [ "test" ]
  pull_request:
    branches: [ "test" ]

jobs:
  phprunner-scan:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang code mula sa GitHub
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Para sa database passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: "" # Ini-scan ang buong repository history

    # STEP 3: Setup PHP Environment
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        coverage: none
        tools: phpstan # Dito natin ilalagay para si shivammathur na ang bahalang mag-ayos ng PATH!

    # STEP 4: Patakbuhin ang Static Analysis sa mga Custom Events at Functions
    - name: Run Static Analysis on Custom Functions
      run: |
        # Gumawa ng malinis na phpstan.neon gamit ang heredoc para iwas indent errors
        cat << 'EOF' > phpstan.neon
        parameters:
          level: 1
          paths:
            - include
          excludePaths:
            - include/lang/*
            - include/dal/*
        EOF
        
        # Patakbuhin gamit ang tool na naka-setup na sa global path
        phpstan analyse --error-format=github