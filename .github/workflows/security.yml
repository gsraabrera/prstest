name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # SEMGREP ADVISORY WORKFLOW (NON-BLOCKING)
    - name: Run Semgrep (SQLi, XSS, & Command Injection Only)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --text \
          > semgrep_results.txt || true
        
        echo "=== ADVANCED SECURITY SCAN RESULTS ==="
        
        if egrep -q "tainted-sql-string|command-injection|cross-site-scripting" semgrep_results.txt; then
          echo "⚠️ WARNING: Critical Security Vulnerability Found in Code!"
          echo "--------------------------------------------------------"
          
          egrep -B 1 -A 25 "tainted-sql-string|command-injection|cross-site-scripting" semgrep_results.txt
          
          echo "--------------------------------------------------------"
          echo "Notice: Please remediate the code flaws above. Deployment is proceeding."
          exit 0 # <--- CHANGED TO 0: Logs the error but DOES NOT block the build
        else
          echo "✅ Security Scan Passed! Custom code is resilient against SQLi, XSS, and Command Injection."
          exit 0
        fi