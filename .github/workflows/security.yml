name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  phprunner-scan:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang code mula sa GitHub
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Para sa database passwords
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: "" # Ini-scan ang buong repository history

    # STEP 3: Setup PHP Environment
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        coverage: none
        tools: phpstan # Dito natin ilalagay para si shivammathur na ang bahalang mag-ayos ng PATH!

    # STEP 4: Patakbuhin ang Static Analysis sa mga Custom Events at Functions
    - name: Run Static Analysis on Custom Functions
      run: |
        cat << 'EOF' > phpstan.neon
        parameters:
          # Level 0 ang pinakamaluwag. Sapat na ito para sa legacy/generated code para SQLi lang at fatal errors ang hanapin.
          level: 0  
          
          # Dito lang siya maghahanap ng error (sa custom events mo)
          paths:
            - include
          
          # Dito naman natin ituturo ang BUONG project para mahanap niya kung nasaan ang mga nawawalang Classes (tulad ng Security, ProjectSettings)
          scanDirectories:
            - classes
            - include
            - .
            
          # Huwag pansinin ang mga sumusunod na errors na gawa ng core PHPRunner system
          ignoreErrors:
            - '#Variable \$.* might not be defined.#'
          
          excludePaths:
            - include/lang/*
            - include/dal/*
        EOF
        
        phpstan analyse --error-format=github