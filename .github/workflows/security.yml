name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog)
    # Hahanapin nito kung may mga naiwang database passwords o API keys
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep Security Scan (Gagamit ng 'p/default' para iwas 404 Error)
    # Ang 'p/default' ay naglalaman na ng OWASP Top 10 at Security Audit rules para sa PHP.
    - name: Run Semgrep (SQLi & Vulnerability Detection)
      uses: semgrep/semgrep-action@v1
      with:
        config: p/default