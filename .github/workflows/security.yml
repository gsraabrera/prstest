name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang source code mula sa GitHub repository
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog)
    # Hahanapin nito kung may mga naiwang database passwords o API keys sa connection settings
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: "" # I-scan ang buong kasaysayan ng commits

    # STEP 3: Semgrep Security Scan (Dito mahuhuli ang SQL Injection)
    # Gagamitin ang opisyal na Semgrep engine para i-audit ang PHP custom events mo.
    # Babagsak (Failure) ang workflow na ito kapag may nakitang seryosong security flaw.
    - name: Run Semgrep (SQLi & Vulnerability Detection)
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
          p/php
          p/owasp-top-10
          p/security-audit