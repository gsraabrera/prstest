name: PHPRunner Security Scan (Semgrep)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    # STEP 1: I-download ang code mula sa GitHub
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # STEP 2: Secret Scanning (TruffleHog) - Hahanap ng passwords/credentials
    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep Security Scan (Dito natin huhulihin ang SQL Injection)
    - name: Run Semgrep (SQLi & Security Audit)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan \
          --config="p/php" \
          --config="p/owasp-top-10" \
          --include="include" \
          --error