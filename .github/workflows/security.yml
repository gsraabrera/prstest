name: PHPRunner Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Secret Scanning (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ""

    # STEP 3: Semgrep (Advanced Multi-Vulnerability Filter)
    - name: Run Semgrep (SQLi, XSS, & Command Injection Only)
      run: |
        docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan \
          --config="p/php" \
          --text \
          > semgrep_results.txt || true
        
        echo "=== ADVANCED SECURITY SCAN RESULTS ==="
        
        # Hahanapin ang alinman sa tatlong kritikal na security flaws na ito
        if egrep -q "tainted-sql-string|command-injection|cross-site-scripting" semgrep_results.txt; then
          echo "❌ ERROR: May natagpuang kritikal na Security Vulnerability!"
          echo "--------------------------------------------------------"
          
          # Iluluwa ang buong detalye kung nasaan ang error
          egrep -B 1 -A 25 "tainted-sql-string|command-injection|cross-site-scripting" semgrep_results.txt
          
          echo "--------------------------------------------------------"
          echo "Aksyon: Ayusin ang code sa itaas bago payagang mag-deploy."
          exit 1
        else
          echo "✅ Security Scan Passed! Ligtas ang custom code mo sa SQLi, XSS, at Command Injection."
          exit 0
        fi